# Render blueprint: one free web service built from the Dockerfile.
#
# The Dockerfile is based on oven/bun:1.2.0 (Debian/glibc) — the same base image the owner's other bot
# deploys on Render successfully. A web service (rather than a worker) is deliberate: Render keeps it
# alive by its own health check, and it can additionally be pinged to stop idle spin-down.
#
# Deploy: push this repo, then in Render choose "New > Blueprint" and pick the repo.
services:
  - type: web
    name: sora
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: LAVALINK_HOST
        sync: false
      - key: LAVALINK_PORT
        sync: false
      - key: LAVALINK_SECURE
        sync: false
      - key: LAVALINK_PASSWORD
        sync: false
      - key: TURSO_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: SUPPORT_INVITE_URL
        sync: false
