# Render blueprint: one free web service on the native Node/Bun runtime.
#
# Bun is the runtime, but dependencies are installed with npm. Bun's own DNS resolver fails in
# Render's build environment (`DNSResolveFailed` for every tarball, on both the Docker and native
# runtimes), while npm resolves through the system resolver and works. The resulting node_modules is
# standard and runs fine under Bun. `BUN_VERSION` pins the runtime; `package-lock.json` pins the tree.
#
# Deploy: push this repo, then in Render choose "New > Blueprint" and pick the repo.
services:
  - type: web
    name: sora
    runtime: node
    buildCommand: npm ci
    startCommand: bun src/index.ts
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BUN_VERSION
        value: 1.4.4
      - key: DISCORD_TOKEN
        sync: false
      - key: LAVALINK_HOST
        sync: false
      - key: LAVALINK_PORT
        sync: false
      - key: LAVALINK_SECURE
        sync: false
      - key: LAVALINK_PASSWORD
        sync: false
      - key: TURSO_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: SUPPORT_INVITE_URL
        sync: false
