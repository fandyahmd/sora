# Render blueprint: one free web service on the native Node/Bun runtime.
#
# Bun is pinned to 1.2.0 to match the base image of a bot the owner already deploys successfully on
# Render. `bun install` here failed DNS on Bun 1.4.4; whether 1.2.0 fixes that on Render is unverified
# from here and should be confirmed on the first deploy. Keep the pin unless a newer version is proven
# to build on Render.
#
# Deploy: push this repo, then in Render choose "New > Blueprint" and pick the repo.
services:
  - type: web
    name: sora
    runtime: node
    buildCommand: bun install --frozen-lockfile
    startCommand: bun src/index.ts
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BUN_VERSION
        value: 1.2.0
      - key: DISCORD_TOKEN
        sync: false
      - key: LAVALINK_HOST
        sync: false
      - key: LAVALINK_PORT
        sync: false
      - key: LAVALINK_SECURE
        sync: false
      - key: LAVALINK_PASSWORD
        sync: false
      - key: TURSO_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: SUPPORT_INVITE_URL
        sync: false
